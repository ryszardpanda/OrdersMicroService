databaseChangeLog:
  - changeSet:
      id: 03-order-module
      author: ryszardpanda
      changes:

        # ---------- ORDERS --------------------------------------------------
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_orders
              - column:
                  name: order_number
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false

              # ---- embedded shipping  -------------------------------------
              - column: { name: ship_first_name, type: VARCHAR(255) }
              - column: { name: ship_last_name,  type: VARCHAR(255) }
              - column: { name: ship_street,     type: VARCHAR(255) }
              - column: { name: ship_city,       type: VARCHAR(255) }
              - column: { name: ship_zip,        type: VARCHAR(30)  }
              - column: { name: ship_phone,      type: VARCHAR(50)  }

              # ---- embedded billing  --------------------------------------
              - column: { name: bill_first_name, type: VARCHAR(255) }
              - column: { name: bill_last_name,  type: VARCHAR(255) }
              - column: { name: bill_street,     type: VARCHAR(255) }
              - column: { name: bill_city,       type: VARCHAR(255) }
              - column: { name: bill_zip,        type: VARCHAR(30)  }
              - column: { name: bill_phone,      type: VARCHAR(50)  }

              # ---- totals & currency ---------------------------------------
              - column:
                  name: total_net
                  type: DECIMAL(19,2)
                  constraints: { nullable: false }
              - column:
                  name: total_gross
                  type: DECIMAL(19,2)
                  constraints: { nullable: false }
              - column:
                  name: shipping_cost
                  type: DECIMAL(19,2)
                  defaultValueNumeric: 0
                  constraints: { nullable: false }
              - column:
                  name: currency
                  type: VARCHAR(3)
                  defaultValue: PLN
                  constraints: { nullable: false }

        # ---------- ORDER ITEM ---------------------------------------------
        - createTable:
            tableName: order_item
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_order_item
              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: unit_price
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: line_net
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false
              - column:
                  name: line_gross
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            constraintName: fk_order_item_order
            baseTableName: order_item
            baseColumnNames: order_id
            referencedTableName: orders
            referencedColumnNames: id
            onDelete: CASCADE

        - addIndex:
            tableName: order_item
            indexName: idx_order_item_orderid
            columns:
              - column: { name: order_id }

        # ---------- ORDER ITEM CONFIG --------------------------------------
        - createTable:
            tableName: order_item_config
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_order_item_cfg
              - column:
                  name: order_item_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: config_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            constraintName: fk_cfg_order_item
            baseTableName: order_item_config
            baseColumnNames: order_item_id
            referencedTableName: order_item
            referencedColumnNames: id
            onDelete: CASCADE

        - addIndex:
            tableName: order_item_config
            indexName: idx_cfg_orderitemid
            columns:
              - column: { name: order_item_id }
